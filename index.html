<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <title>Reconhecedor de Linguagem Regular</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #d6d6d6;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 13px;
        }

        .janela {
            width: 555px;
            margin: 30px auto;

            background-color: #d4d0c8;

            border-top: 2px solid white;
            border-left: 2px solid white;
            border-right: 2px solid #404040;
            border-bottom: 2px solid #404040;
        }

        .titulo {
            height: 22px;

            background-color: #000080;
            color: white;

            display: flex;
            align-items: center;

            padding-left: 5px;

            font-weight: bold;
            font-size: 12px;
        }

        .icone {
            width: 15px;
            height: 15px;

            margin-right: 5px;

            background-color: #008000;

            border: 1px solid #004000;

            position: relative;
        }

        .icone::after {
            content: "✓";

            position: absolute;

            left: 2px;
            top: -2px;

            color: yellow;
            font-weight: bold;
        }

        .conteudo {
            padding: 10px;
        }

        #campoA {
            width: 100%;
            height: 145px;

            resize: none;

            background-color: white;

            font-family: "Courier New", monospace;
            font-size: 14px;

            padding: 4px;

            border-top: 2px solid #808080;
            border-left: 2px solid #808080;
            border-right: 2px solid white;
            border-bottom: 2px solid white;

            outline: none;
        }

        .botoes {
            height: 38px;

            display: flex;
            justify-content: flex-end;
            align-items: center;

            gap: 6px;
        }

        button {
            height: 24px;
            min-width: 78px;

            background-color: #d4d0c8;

            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;

            border-top: 2px solid white;
            border-left: 2px solid white;
            border-right: 2px solid #404040;
            border-bottom: 2px solid #404040;

            cursor: pointer;
        }

        button:active {
            border-top: 2px solid #404040;
            border-left: 2px solid #404040;
            border-right: 2px solid white;
            border-bottom: 2px solid white;
        }

        .analisar::before {
            content: "✓ ";
            color: red;
            font-weight: bold;
        }

        .limpar::before {
            content: "🧹 ";
        }

        fieldset {
            margin: 0;

            padding: 5px 7px 7px 7px;

            border: 1px solid #808080;
        }

        legend {
            padding: 0 3px;

            font-size: 12px;
        }

        #campoB {
            width: 100%;
            height: 110px;

            resize: none;

            background-color: white;

            font-family: "Courier New", monospace;
            font-size: 13px;

            padding: 4px;

            border-top: 2px solid #808080;
            border-left: 2px solid #808080;
            border-right: 2px solid white;
            border-bottom: 2px solid white;

            outline: none;
        }

    </style>

</head>


<body>

    <div class="janela">

        <div class="titulo">

            <div class="icone"></div>

            Reconhecedor de Linguagem Regular

        </div>


        <div class="conteudo">

            <textarea
                id="campoA"
            ></textarea>

            <div class="botoes">

                <button
                    class="analisar"
                    onclick="analisar()"
                >
                    Analisar
                </button>

                <button
                    class="limpar"
                    onclick="limpar()"
                >
                    Limpar
                </button>

            </div>

            <fieldset>

                <legend>Tokens</legend>

                <textarea
                    id="campoB"
                    readonly
                ></textarea>

            </fieldset>

        </div>

    </div>

    <script src="main.js"></script>

</body>

</html>
