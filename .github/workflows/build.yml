name: Gerar executáveis C++

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:

  # ============================================================
  # WINDOWS
  # ============================================================
  windows:
    name: Windows
    runs-on: windows-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-fltk

      - name: Compilar Windows
        shell: msys2 {0}
        run: |
          cmake -S . -B build \
            -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++"

          cmake --build build --config Release

      - name: Reduzir executável
        shell: msys2 {0}
        run: |
          strip build/Reconhecedor.exe

      - name: Mostrar tamanho
        shell: msys2 {0}
        run: |
          ls -lh build/Reconhecedor.exe

      - name: Publicar Windows
        uses: actions/upload-artifact@v4
        with:
          name: Reconhecedor-Windows
          path: build/Reconhecedor.exe


  # ============================================================
  # LINUX
  # ============================================================
  linux:
    name: Linux
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          sudo apt update
          sudo apt install -y \
            g++ \
            cmake \
            git \
            libfltk1.3-dev

      - name: Compilar Linux
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build build --config Release

      - name: Reduzir executável
        run: |
          strip build/Reconhecedor

      - name: Dar permissão de execução
        run: |
          chmod +x build/Reconhecedor

      - name: Mostrar tamanho
        run: |
          ls -lh build/Reconhecedor

      - name: Publicar Linux
        uses: actions/upload-artifact@v4
        with:
          name: Reconhecedor-Linux
          path: build/Reconhecedor


  # ============================================================
  # VERIFICAR LIMITE DE 10 MB
  # ============================================================
  verificar-tamanho:
    name: Verificar limite de 10 MB
    runs-on: ubuntu-latest
    needs:
      - windows
      - linux

    steps:

      - name: Baixar executável Windows
        uses: actions/download-artifact@v4
        with:
          name: Reconhecedor-Windows
          path: windows

      - name: Baixar executável Linux
        uses: actions/download-artifact@v4
        with:
          name: Reconhecedor-Linux
          path: linux

      - name: Verificar tamanho total
        run: |
          WINDOWS=$(stat -c%s windows/Reconhecedor.exe)
          LINUX=$(stat -c%s linux/Reconhecedor)

          TOTAL=$((WINDOWS + LINUX))
          LIMITE=$((10 * 1024 * 1024))

          echo "================================="
          echo "Windows: $WINDOWS bytes"
          echo "Linux:   $LINUX bytes"
          echo "Total:   $TOTAL bytes"
          echo "Limite:  $LIMITE bytes"
          echo "================================="

          if [ "$TOTAL" -gt "$LIMITE" ]; then
            echo "ERRO: os executáveis ultrapassaram 10 MB."
            exit 1
          fi

          echo "OK: os executáveis estão dentro do limite de 10 MB."